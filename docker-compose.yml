services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: purpose
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: faridun_5686
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_NAME=purpose
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=faridun_5686
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

volumes:
  postgres_data: